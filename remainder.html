<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminder Register</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --expired-color: #f8d7da;
            --active-color: #d1eddd;
            --reminder-color: #fff3cd;
        }
        
        .card {
            border-radius: 12px;
            overflow: hidden;
        }
        
        .card-header {
            background: linear-gradient(135deg, #2c3e50, #4a6491) !important;
            border-bottom: none;
        }
        
        .breadcrumb-item a {
            color: #e9ecef !important;
            transition: color 0.3s;
        }
        
        .breadcrumb-item a:hover {
            color: white !important;
        }
        
        .breadcrumb-item.active {
            color: white !important;
        }
        
        .table-danger {
            background-color: var(--expired-color);
        }
        
        .table-success {
            background-color: var(--active-color);
        }
        
        .table-warning {
            background-color: var(--reminder-color);
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        
        .expired-indicator {
            background-color: #dc3545;
        }
        
        .active-indicator {
            background-color: #198754;
        }
        
        .reminder-indicator {
            background-color: #ffc107;
        }
        
        .btn-success {
            background-color: #28a745;
            border-color: #28a745;
        }
        
        .btn-primary {
            background-color: #4a6491;
            border-color: #4a6491;
        }
        
        .table-hover tbody tr:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        
        .badge {
            font-size: 0.75em;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #4a6491;
            box-shadow: 0 0 0 0.2rem rgba(74, 100, 145, 0.25);
        }
        
        .pagination .page-item.active .page-link {
            background-color: #4a6491;
            border-color: #4a6491;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-right: 15px;
        }
        
        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 3px;
            margin-right: 5px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid py-3">
        <div class="card shadow-lg border-0">
            <!-- Header -->
            <div class="card-header bg-white text-white py-4">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="#" class="text-decoration-none" onclick="navigateBacktoIndex()">
                            <i class="fas fa-home me-1"></i>Dashboard
                        </a></li>
                        <li class="breadcrumb-item active" aria-current="page">Reminder Register</li>
                    </ol>
                </nav>
            </div>
            
            <!-- Filter Section -->
            <div class="card-body bg-light">
                <div class="row g-3 align-items-end mb-4">
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">FROM DATE</label>
                        <input type="date" class="form-control" id="fromDate" value="2025-10-13">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">TO DATE</label>
                        <input type="date" class="form-control" id="toDate" value="2025-10-13">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">ACCOUNT NAME</label>
                        <input type="text" class="form-control" id="accountName" placeholder="Enter Account Name">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">STATUS</label>
                        <select class="form-select" id="statusFilter">
                            <option value="all">All Status</option>
                            <option value="expired">Expired</option>
                            <option value="active">Active</option>
                            <option value="reminder">Reminder On</option>
                        </select>
                    </div>
                </div>
                
                <div class="d-flex justify-content-between flex-wrap gap-2">
                    <div class="d-flex gap-2 flex-wrap">
                        <button class="btn btn-success" onclick="searchReminders()">
                            <i class="fas fa-search me-2"></i>Search
                        </button>
                        <button class="btn btn-success" onclick="exportToExcel()">
                            <i class="fas fa-file-excel me-2"></i>Excel
                        </button>
                        <button class="btn btn-primary" onclick="refreshData()">
                            <i class="fas fa-sync-alt me-2"></i>Refresh
                        </button>
                    </div>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addReminderModal">
                        <i class="fas fa-plus me-2"></i>Add Reminder
                    </button>
                </div>
            </div>
            
            <!-- Table Section -->
            <div class="card-body">
                <!-- Legend -->
                <div class="d-flex gap-4 mb-3 flex-wrap">
                    <div class="legend-item">
                        <div class="legend-color bg-danger"></div>
                        <span class="small">EXPIRED</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color bg-success"></div>
                        <span class="small">ACTIVE</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color bg-warning"></div>
                        <span class="small">REMINDER ON</span>
                    </div>
                </div>
                
                <!-- Table Controls -->
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <div class="d-flex align-items-center gap-2">
                        <span class="small">Show</span>
                        <select class="form-select form-select-sm w-auto" id="entriesPerPage" onchange="changeEntriesPerPage()">
                            <option value="10">10</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="300">300</option>
                            <option value="500">500</option>
                            <option value="1000">1000</option>
                        </select>
                        <span class="small">entries</span>
                    </div>
                    
                    <div class="d-flex gap-1" id="pagination">
                        <!-- Pagination will be generated here -->
                    </div>
                </div>
                
                <!-- Table -->
                <div class="table-responsive">
                    <table class="table table-hover table-bordered" id="reminderTable">
                        <thead class="table-primary">
                            <tr>
                                <th>SR.</th>
                                <th>ACCOUNT NAME</th>
                                <th>ACCOUNT TYPE</th>
                                <th>START DATE</th>
                                <th>EXPIRY DATE</th>
                                <th>REMINDER DAYS</th>
                                <th>REMINDER TYPE</th>
                                <th>PHOTO UPLOAD</th>
                                <th>DUE DAYS</th>
                                <th>OTHER</th>
                                <th>OTHER1</th>
                                <th>OTHER2</th>
                                <th>ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Table rows will be generated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add Reminder Modal -->
    <div class="modal fade" id="addReminderModal" tabindex="-1" aria-labelledby="addReminderModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addReminderModalLabel">Add New Reminder</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addReminderForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Account Name</label>
                                <input type="text" class="form-control" id="newAccountName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Account Type</label>
                                <select class="form-select" id="newAccountType" required>
                                    <option value="">Select Type</option>
                                    <option value="Vehicle">Vehicle</option>
                                    <option value="Personal">Personal</option>
                                    <option value="Business">Business</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Start Date</label>
                                <input type="date" class="form-control" id="newStartDate" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Expiry Date</label>
                                <input type="date" class="form-control" id="newExpiryDate" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Reminder Days</label>
                                <input type="number" class="form-control" id="newReminderDays" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Reminder Type</label>
                                <select class="form-select" id="newReminderType" required>
                                    <option value="">Select Type</option>
                                    <option value="Driving Licence">Driving Licence</option>
                                    <option value="Insurance">Insurance</option>
                                    <option value="License Renewal">License Renewal</option>
                                    <option value="Membership">Membership</option>
                                </select>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Photo Upload</label>
                                <input type="file" class="form-control" id="newPhotoUpload">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addNewReminder()">Save Reminder</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sample data for the application
        let reminders = [
            { id: 1, accountName: "BARUN ROY", accountType: "Vehicle", startDate: "2024-08-27", expiryDate: "2025-08-27", reminderDays: 30, reminderType: "Driving Licence", photoUpload: "-", dueDays: -365, status: "expired", other: "-", other1: "-", other2: "-" },
            { id: 2, accountName: "BARUN ROY", accountType: "Vehicle", startDate: "2024-08-27", expiryDate: "2025-08-27", reminderDays: 30, reminderType: "Insurance", photoUpload: "-", dueDays: -365, status: "expired", other: "-", other1: "-", other2: "-" },
            { id: 3, accountName: "RAKESH KUMAR", accountType: "Vehicle", startDate: "2024-08-27", expiryDate: "2025-08-27", reminderDays: 30, reminderType: "Driving Licence", photoUpload: "-", dueDays: -365, status: "expired", other: "-", other1: "-", other2: "-" },
            { id: 4, accountName: "RAKESH KUMAR", accountType: "Vehicle", startDate: "2024-08-27", expiryDate: "2025-08-27", reminderDays: 30, reminderType: "Insurance", photoUpload: "-", dueDays: -365, status: "expired", other: "-", other1: "-", other2: "-" },
            { id: 5, accountName: "MD. SAFIULLAH", accountType: "Vehicle", startDate: "2024-08-27", expiryDate: "2025-08-27", reminderDays: 30, reminderType: "Driving Licence", photoUpload: "-", dueDays: -365, status: "expired", other: "-", other1: "-", other2: "-" },
            { id: 6, accountName: "MD. SAFIULLAH", accountType: "Vehicle", startDate: "2024-08-27", expiryDate: "2025-08-27", reminderDays: 30, reminderType: "Insurance", photoUpload: "-", dueDays: -365, status: "expired", other: "-", other1: "-", other2: "-" },
            { id: 7, accountName: "SAMAD ALI SHAIKH", accountType: "Vehicle", startDate: "2024-08-27", expiryDate: "2025-08-27", reminderDays: 30, reminderType: "Driving Licence", photoUpload: "-", dueDays: -365, status: "expired", other: "-", other1: "-", other2: "-" },
            { id: 8, accountName: "SAMAD ALI SHAIKH", accountType: "Vehicle", startDate: "2024-08-27", expiryDate: "2025-08-27", reminderDays: 30, reminderType: "Insurance", photoUpload: "-", dueDays: -365, status: "expired", other: "-", other1: "-", other2: "-" },
            { id: 9, accountName: "MD. SAFIULLAH", accountType: "Vehicle", startDate: "2024-08-27", expiryDate: "2025-08-27", reminderDays: 30, reminderType: "Driving Licence", photoUpload: "-", dueDays: -365, status: "expired", other: "-", other1: "-", other2: "-" },
            { id: 10, accountName: "MD. SAFIULLAH", accountType: "Vehicle", startDate: "2024-08-27", expiryDate: "2025-08-27", reminderDays: 30, reminderType: "Driving Licence", photoUpload: "-", dueDays: -365, status: "expired", other: "-", other1: "-", other2: "-" },
            { id: 11, accountName: "JOHN DOE", accountType: "Personal", startDate: "2025-01-15", expiryDate: "2026-01-15", reminderDays: 45, reminderType: "License Renewal", photoUpload: "-", dueDays: 92, status: "active", other: "-", other1: "-", other2: "-" },
            { id: 12, accountName: "JANE SMITH", accountType: "Business", startDate: "2024-12-01", expiryDate: "2025-06-01", reminderDays: 15, reminderType: "Membership", photoUpload: "-", dueDays: -30, status: "reminder", other: "-", other1: "-", other2: "-" }
        ];

        let currentPage = 1;
        let entriesPerPage = 10;
        let filteredReminders = [...reminders];

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            renderTable();
            setupPagination();
        });

        // Render the table with current data
        function renderTable() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            
            const startIndex = (currentPage - 1) * entriesPerPage;
            const endIndex = Math.min(startIndex + entriesPerPage, filteredReminders.length);
            
            for (let i = startIndex; i < endIndex; i++) {
                const reminder = filteredReminders[i];
                const row = document.createElement('tr');
                
                // Determine row class based on status
                if (reminder.status === 'expired') {
                    row.className = 'table-danger';
                } else if (reminder.status === 'active') {
                    row.className = 'table-success';
                } else if (reminder.status === 'reminder') {
                    row.className = 'table-warning';
                }
                
                // Format dates
                const startDate = new Date(reminder.startDate).toLocaleDateString('en-GB');
                const expiryDate = new Date(reminder.expiryDate).toLocaleDateString('en-GB');
                
                // Determine badge for due days
                let dueDaysBadge = '';
                if (reminder.dueDays < 0) {
                    dueDaysBadge = `<span class="badge bg-danger">Expired ${Math.abs(reminder.dueDays)} days ago</span>`;
                } else if (reminder.dueDays <= reminder.reminderDays) {
                    dueDaysBadge = `<span class="badge bg-warning">Due in ${reminder.dueDays} days</span>`;
                } else {
                    dueDaysBadge = `<span class="badge bg-success">Active</span>`;
                }
                
                row.innerHTML = `
                    <td>${i + 1}</td>
                    <td><strong>${reminder.accountName}</strong></td>
                    <td><span class="badge bg-secondary">${reminder.accountType}</span></td>
                    <td>${startDate}</td>
                    <td>${expiryDate}</td>
                    <td>${reminder.reminderDays}</td>
                    <td><span class="badge ${reminder.reminderType === 'Driving Licence' ? 'bg-info' : 'bg-warning'}">${reminder.reminderType}</span></td>
                    <td>${reminder.photoUpload}</td>
                    <td>${dueDaysBadge}</td>
                    <td>${reminder.other}</td>
                    <td>${reminder.other1}</td>
                    <td>${reminder.other2}</td>
                    <td><button class="btn btn-success btn-sm" onclick="completeReminder(${reminder.id})">Complete</button></td>
                `;
                
                tableBody.appendChild(row);
            }
        }

        // Setup pagination
        function setupPagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredReminders.length / entriesPerPage);
            
            pagination.innerHTML = '';
            
            // First button
            const firstButton = document.createElement('button');
            firstButton.className = 'btn btn-sm btn-outline-primary';
            firstButton.textContent = 'First';
            firstButton.onclick = () => goToPage(1);
            pagination.appendChild(firstButton);
            
            // Previous button
            const prevButton = document.createElement('button');
            prevButton.className = 'btn btn-sm btn-outline-primary';
            prevButton.textContent = '«';
            prevButton.disabled = currentPage === 1;
            prevButton.onclick = () => goToPage(currentPage - 1);
            pagination.appendChild(prevButton);
            
            // Page buttons
            for (let i = 1; i <= totalPages; i++) {
                const pageButton = document.createElement('button');
                pageButton.className = `btn btn-sm ${i === currentPage ? 'btn-primary' : 'btn-outline-primary'}`;
                pageButton.textContent = i;
                pageButton.onclick = () => goToPage(i);
                pagination.appendChild(pageButton);
            }
            
            // Next button
            const nextButton = document.createElement('button');
            nextButton.className = 'btn btn-sm btn-outline-primary';
            nextButton.textContent = '»';
            nextButton.disabled = currentPage === totalPages;
            nextButton.onclick = () => goToPage(currentPage + 1);
            pagination.appendChild(nextButton);
            
            // Last button
            const lastButton = document.createElement('button');
            lastButton.className = 'btn btn-sm btn-outline-primary';
            lastButton.textContent = 'Last';
            lastButton.onclick = () => goToPage(totalPages);
            pagination.appendChild(lastButton);
        }

        // Go to specific page
        function goToPage(page) {
            currentPage = page;
            renderTable();
            setupPagination();
        }

        // Change entries per page
        function changeEntriesPerPage() {
            entriesPerPage = parseInt(document.getElementById('entriesPerPage').value);
            currentPage = 1;
            renderTable();
            setupPagination();
        }

        // Search reminders based on filters
        function searchReminders() {
            const fromDate = document.getElementById('fromDate').value;
            const toDate = document.getElementById('toDate').value;
            const accountName = document.getElementById('accountName').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            
            filteredReminders = reminders.filter(reminder => {
                // Date filter
                if (fromDate && reminder.startDate < fromDate) return false;
                if (toDate && reminder.expiryDate > toDate) return false;
                
                // Account name filter
                if (accountName && !reminder.accountName.toLowerCase().includes(accountName)) return false;
                
                // Status filter
                if (statusFilter !== 'all' && reminder.status !== statusFilter) return false;
                
                return true;
            });
            
            currentPage = 1;
            renderTable();
            setupPagination();
        }

        // Refresh data
        function refreshData() {
            document.getElementById('fromDate').value = '2025-10-13';
            document.getElementById('toDate').value = '2025-10-13';
            document.getElementById('accountName').value = '';
            document.getElementById('statusFilter').value = 'all';
            
            filteredReminders = [...reminders];
            currentPage = 1;
            renderTable();
            setupPagination();
        }

        // Complete reminder
        function completeReminder(id) {
            if (confirm('Are you sure you want to mark this reminder as complete?')) {
                // In a real application, you would update the database here
                // For this demo, we'll just remove it from the array
                reminders = reminders.filter(reminder => reminder.id !== id);
                filteredReminders = filteredReminders.filter(reminder => reminder.id !== id);
                
                renderTable();
                setupPagination();
                
                alert('Reminder marked as complete!');
            }
        }

        // Add new reminder
        function addNewReminder() {
            const accountName = document.getElementById('newAccountName').value;
            const accountType = document.getElementById('newAccountType').value;
            const startDate = document.getElementById('newStartDate').value;
            const expiryDate = document.getElementById('newExpiryDate').value;
            const reminderDays = parseInt(document.getElementById('newReminderDays').value);
            const reminderType = document.getElementById('newReminderType').value;
            
            if (!accountName || !accountType || !startDate || !expiryDate || !reminderDays || !reminderType) {
                alert('Please fill in all required fields');
                return;
            }
            
            // Calculate due days
            const today = new Date();
            const expiry = new Date(expiryDate);
            const dueDays = Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));
            
            // Determine status based on due days
            let status = 'active';
            if (dueDays < 0) {
                status = 'expired';
            } else if (dueDays <= reminderDays) {
                status = 'reminder';
            }
            
            // Create new reminder
            const newReminder = {
                id: reminders.length > 0 ? Math.max(...reminders.map(r => r.id)) + 1 : 1,
                accountName,
                accountType,
                startDate,
                expiryDate,
                reminderDays,
                reminderType,
                photoUpload: '-',
                dueDays,
                status,
                other: '-',
                other1: '-',
                other2: '-'
            };
            
            // Add to arrays
            reminders.push(newReminder);
            filteredReminders.push(newReminder);
            
            // Close modal and reset form
            const modal = bootstrap.Modal.getInstance(document.getElementById('addReminderModal'));
            modal.hide();
            document.getElementById('addReminderForm').reset();
            
            // Refresh table
            renderTable();
            setupPagination();
            
            alert('Reminder added successfully!');
        }

        // Export to Excel (simulated)
        function exportToExcel() {
            alert('Exporting data to Excel...');
            // In a real application, this would generate and download an Excel file
        }

        // Navigate back to dashboard
        function navigateBacktoIndex() {
           
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
